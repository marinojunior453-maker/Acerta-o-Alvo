<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acerta o Alvo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#101827,#244b73);color:white;min-height:100vh}.c{max-width:900px;margin:auto;padding:24px 16px;text-align:center}.p{background:#ffffff12;border:1px solid #ffffff22;border-radius:20px;padding:20px;box-shadow:0 12px 30px #0005}h1{font-size:40px;margin:8px}.intro{color:#cbd8e8}.stats{display:flex;gap:8px;margin:12px 0}.stat{flex:1;background:#0003;border-radius:12px;padding:9px}.stat b{display:block;font-size:24px;margin-top:4px}#game{height:500px;position:relative;overflow:hidden;border-radius:18px;border:2px solid #6c8db0;background:radial-gradient(circle,#315b83,#132a45);cursor:crosshair}#target{position:absolute;width:74px;height:74px;border-radius:50%;display:none;background:radial-gradient(circle,#fff 0 12%,#e83e5b 13% 34%,#fff 35% 51%,#e83e5b 52%);box-shadow:0 0 25px #e83e5baa;cursor:pointer}button{margin:14px 5px 0;padding:13px 24px;border:0;border-radius:12px;background:#4f8cff;color:white;font-size:16px;font-weight:bold}.s{background:#33465e}.hidden{display:none}.big{font-size:60px;font-weight:bold}.hint{font-size:13px;color:#b7c7da}@media(max-width:600px){h1{font-size:32px}#game{height:430px}}</style></head>
<body><div class="c"><div class="p"><div style="font-size:46px">🎯</div><h1>Acerta o Alvo</h1><p class="intro">Acerte o máximo de alvos em 30 segundos!</p>
<div id="home"><h2>Como jogar?</h2><p>Clique no alvo vermelho para ganhar pontos. Evite clicar fora.</p><button onclick="startGame()">🎮 Começar jogo</button><p class="hint">Projeto escolar • HTML, CSS e JavaScript</p></div>
<div id="area" class="hidden"><div class="stats"><div class="stat">Pontos<b id="score">0</b></div><div class="stat">Tempo<b id="time">30</b></div><div class="stat">Recorde<b id="best">0</b></div></div><div id="game"><div id="target"></div></div><div id="msg">Clique no alvo!</div><button class="s" onclick="home()">Voltar</button></div>
<div id="res" class="hidden"><div style="font-size:48px">🏆</div><h2>Fim de jogo!</h2><p>Sua pontuação:</p><div class="big" id="final">0</div><p id="rm"></p><button onclick="startGame()">🔄 Jogar novamente</button><button class="s" onclick="home()">🏠 Início</button></div>
</div></div>
<script>
const H=document.getElementById('home'),A=document.getElementById('area'),R=document.getElementById('res'),G=document.getElementById('game'),T=document.getElementById('target'),S=document.getElementById('score'),TM=document.getElementById('time'),B=document.getElementById('best'),M=document.getElementById('msg');let score=0,time=30,timer=null,run=false,best=+localStorage.getItem('acertaRecorde')||0;B.textContent=best;
function show(x){H.classList.add('hidden');A.classList.add('hidden');R.classList.add('hidden');x.classList.remove('hidden')}function move(){let s=74;T.style.left=Math.random()*(G.clientWidth-s)+'px';T.style.top=Math.random()*(G.clientHeight-s)+'px'}
function startGame(){show(A);score=0;time=30;run=true;S.textContent=0;TM.textContent=30;T.style.display='block';move();M.textContent='Clique no alvo!';clearInterval(timer);timer=setInterval(()=>{time--;TM.textContent=time;if(time<=0)finish()},1000)}
function finish(){if(!run)return;run=false;clearInterval(timer);T.style.display='none';document.getElementById('final').textContent=score;if(score>best){best=score;localStorage.setItem('acertaRecorde',best);B.textContent=best;document.getElementById('rm').textContent='🎉 Novo recorde!'}else document.getElementById('rm').textContent='Boa partida!';show(R)}
function home(){run=false;clearInterval(timer);T.style.display='none';show(H)}T.onclick=e=>{e.stopPropagation();if(run){score++;S.textContent=score;move()}};G.onclick=()=>{if(run){score=Math.max(0,score-1);S.textContent=score;M.textContent='Ops! Clique no alvo.'}};
</script></body></html>
